<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Canoe Lake Clean Up - PoC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      background: #87ceeb;
      width: 100%;
      height: 100%;
      height: 100dvh;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html.touch-device,
    body.touch-device,
    html.touch-ui,
    body.touch-ui {
      background: #000;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      font-size: 16px;
      pointer-events: none;
      z-index: 10;
    }

    #cleanliness-meter {
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    #cleanliness-bar {
      width: 200px;
      height: 20px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
      border: 2px solid #666;
    }

    #cleanliness-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.3s, background 0.3s;
    }

    #cleanliness-fill.warning {
      background: linear-gradient(90deg, #ff9800, #ffc107);
    }

    #cleanliness-fill.danger {
      background: linear-gradient(90deg, #f44336, #ff5722);
    }

    #score-panel {
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: right;
      min-width: 200px;
    }

    #score-value {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #cleaned {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    #complaints-line {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 1px;
    }

    #complaints-line.bad {
      opacity: 1;
      color: #ff9c7a;
    }

    #combo {
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    #combo.active {
      opacity: 1;
    }

    #combo-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd23a;
    }

    #combo-bar {
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }

    #combo-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ffd23a, #ff8a2b);
    }

    #objective-arrow {
      position: absolute;
      top: 64px;
      left: 50%;
      width: 56px;
      height: 48px;
      margin-left: -28px;
      margin-top: -24px;
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transition: opacity 0.2s ease;
      perspective: 140px;
      perspective-origin: 50% 100%;
    }

    #objective-arrow.visible {
      opacity: 0.95;
    }

    #objective-arrow.hovering {
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
    }

    /* Tilted like a marker on the ground — tip-up means straight ahead. */
    #objective-arrow .objective-chevron {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      transform-origin: 50% 70%;
      transform: rotateX(58deg) rotateZ(0rad);
      filter: drop-shadow(0 10px 6px rgba(0, 0, 0, 0.45));
      will-change: transform;
    }

    #objective-arrow .objective-chevron::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffe566 0%, #ffd23a 42%, #e89a20 100%);
      clip-path: polygon(
        50% 0%,
        92% 48%,
        68% 48%,
        68% 100%,
        32% 100%,
        32% 48%,
        8% 48%
      );
      border-radius: 1px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    #instructions {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
      z-index: 10;
    }

    #hurt-flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease-out;
      z-index: 15;
      background: radial-gradient(
        ellipse at center,
        rgba(180,20,20,0) 35%,
        rgba(180,20,20,0.55) 100%
      );
    }

    #hurt-flash.on {
      opacity: 1;
      transition: opacity 0.05s;
    }

    #minimap-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 6px;
      pointer-events: none;
      z-index: 10;
    }

    #minimap {
      display: block;
      width: 220px;
      height: 132px;
      border-radius: 4px;
    }

    #clock-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.55);
      border-radius: 8px;
      padding: 10px 16px;
      color: white;
      pointer-events: none;
      z-index: 10;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #clock {
      font-size: 30px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      line-height: 1;
    }

    #weather {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }

    #mugshot-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 4px;
      pointer-events: none;
      z-index: 10;
      line-height: 0;
    }

    #mugshot {
      display: block;
      width: 96px;
      height: auto;
      aspect-ratio: 48 / 56;
      image-rendering: pixelated;
    }

    #messages {
      position: absolute;
      bottom: 90px;
      right: 20px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    .message {
      width: 100%;
      background: rgba(0,0,0,0.62);
      border-left: 3px solid #ffd23a;
      border-radius: 6px;
      padding: 7px 10px;
      color: #f2f2ee;
      font-size: 12px;
      line-height: 1.35;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateX(24px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .message.in {
      opacity: 1;
      transform: translateX(0);
    }

    .message-from {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 1px;
      color: #ffd23a;
      margin-bottom: 2px;
    }

    .message-from span {
      color: rgba(255,255,255,0.55);
      letter-spacing: 0;
    }

    #health-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(80px);
      width: 150px;
      background: rgba(0,0,0,0.55);
      border-radius: 8px;
      padding: 8px 10px;
      color: white;
      font-size: 11px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
    }

    #health-bar {
      height: 12px;
      background: #331a1a;
      border: 2px solid #6b3a3a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    #health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #d33a2c, #ff7a5c);
      transition: width 0.2s;
    }

    #health-fill.low {
      animation: throb 0.7s ease-in-out infinite;
    }

    @keyframes throb {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    #game-over {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(40,0,0,0.72);
      color: #fff;
      text-align: center;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      z-index: 30;
    }

    #game-over.on {
      display: flex;
    }

    #game-over h1 {
      font-size: 46px;
      letter-spacing: 3px;
    }

    #game-over p {
      font-size: 15px;
      opacity: 0.9;
      line-height: 1.6;
    }

    #restart {
      margin-top: 8px;
      padding: 12px 26px;
      font: inherit;
      font-size: 16px;
      letter-spacing: 1px;
      color: #2b1a12;
      background: #ffd23a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #restart:hover {
      background: #ffe27a;
    }

    /* Mobile Controls — hidden until JS adds .visible */
    #mobile-controls {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    #mobile-controls.visible,
    body.touch-ui #mobile-controls {
      display: block;
    }

    .stick {
      display: none;
      position: absolute;
      bottom: 40px;
      width: 120px;
      height: 120px;
      background: rgba(0, 0, 0, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
      z-index: 41;
    }

    .stick.visible {
      display: block;
    }

    #joystick-container {
      left: 40px;
    }

    #look-joystick-container {
      right: 40px;
    }

    /* Spray stick stacks above the look stick on the right. */
    #spray-joystick-container {
      right: 40px;
      bottom: 170px;
      border-color: rgba(120, 200, 255, 0.7);
      background: rgba(30, 80, 110, 0.4);
    }

    #spray-joystick-container.active {
      border-color: rgba(160, 220, 255, 0.95);
      background: rgba(40, 110, 150, 0.55);
    }

    #spray-joystick-container .stick-knob {
      background: rgba(140, 210, 255, 0.9);
      border-color: rgba(200, 240, 255, 1);
    }

    .stick.active {
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.85);
    }

    .stick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.85);
      border: 3px solid rgba(255, 255, 255, 1);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: background 0.1s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .stick.active .stick-knob {
      background: rgba(255, 255, 255, 1);
    }

    #rotate-prompt {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 100;
      background: #1a221c;
      color: #e8efe6;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: auto;
    }

    #rotate-prompt.visible {
      display: flex;
    }

    /* Portrait lock — keep any loaded canvas from showing behind the prompt. */
    body.world-frozen #game-container canvas {
      visibility: hidden;
    }

    #rotate-prompt .rotate-card {
      max-width: 280px;
    }

    #rotate-prompt .rotate-phone {
      width: 52px;
      height: 86px;
      margin: 0 auto 18px;
      border: 3px solid #c5d4c0;
      border-radius: 8px;
      position: relative;
      animation: tip-phone 1.6s ease-in-out infinite;
    }

    #rotate-prompt .rotate-phone::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      width: 14px;
      height: 3px;
      margin-left: -7px;
      background: #c5d4c0;
      border-radius: 2px;
    }

    @keyframes tip-phone {
      0%, 20% { transform: rotate(0deg); }
      50%, 70% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }

    #rotate-prompt p {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }

    /* touch-ui = phone in landscape with three sticks. Portrait phones get #rotate-prompt. */
    body.touch-ui #hud {
      top: 4px;
      right: 4px;
      font-size: 10px;
      max-width: 130px;
    }

    body.touch-ui #score-panel,
    body.touch-ui #cleanliness-meter {
      padding: 3px 6px;
      margin-bottom: 3px;
      border-radius: 6px;
    }

    body.touch-ui #score-panel {
      min-width: 0;
      width: 100%;
    }

    body.touch-ui #score-value {
      font-size: 14px;
    }

    body.touch-ui #cleaned,
    body.touch-ui #complaints-line,
    body.touch-ui #combo {
      display: none;
    }

    body.touch-ui #cleanliness-bar {
      width: 100%;
      height: 8px;
      margin-top: 2px;
      border-width: 1px;
    }

    body.touch-ui #instructions {
      display: none;
    }

    body.touch-ui #minimap-panel {
      top: 4px;
      left: 4px;
      padding: 2px;
      border-width: 1px;
    }

    body.touch-ui #minimap {
      width: 90px;
      height: 54px;
    }

    body.touch-ui #clock-panel {
      bottom: calc(108px + env(safe-area-inset-bottom));
      left: max(4px, env(safe-area-inset-left));
      padding: 3px 6px;
    }

    body.touch-ui #clock {
      font-size: 14px;
    }

    body.touch-ui #weather {
      display: none;
    }

    /* Face + health clustered in the bottom centre, clear of both sticks. */
    body.touch-ui #mugshot-panel {
      left: 50%;
      right: auto;
      bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-58px);
      padding: 2px;
      border-width: 1px;
    }

    body.touch-ui #mugshot {
      width: 44px;
    }

    body.touch-ui #health-panel {
      left: 50%;
      right: auto;
      bottom: calc(14px + env(safe-area-inset-bottom));
      width: 78px;
      transform: translateX(6px);
      padding: 3px 5px;
      font-size: 8px;
    }

    body.touch-ui #health-bar {
      height: 8px;
      margin-top: 2px;
      border-width: 1px;
    }

    body.touch-ui #messages {
      bottom: calc(12px + 88px + 12px + 88px + 14px + env(safe-area-inset-bottom));
      right: max(4px, env(safe-area-inset-right));
      width: min(36vw, 180px);
      gap: 4px;
    }

    body.touch-ui .message {
      font-size: 10px;
      padding: 5px 7px;
      border-radius: 5px;
    }

    body.touch-ui .message-from {
      font-size: 9px;
    }

    body.touch-ui .stick {
      width: 88px;
      height: 88px;
      bottom: calc(12px + env(safe-area-inset-bottom));
    }

    body.touch-ui #joystick-container {
      left: max(12px, env(safe-area-inset-left));
    }

    body.touch-ui #look-joystick-container {
      right: max(12px, env(safe-area-inset-right));
    }

    body.touch-ui .stick-knob {
      width: 36px;
      height: 36px;
    }

    /* Spray aim stick sits above the look stick. */
    body.touch-ui #spray-joystick-container {
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(12px + 88px + 12px + env(safe-area-inset-bottom));
    }

    body.touch-ui #game-over h1 {
      font-size: 22px;
      letter-spacing: 2px;
      padding: 0 12px;
    }

    body.touch-ui #game-over p {
      font-size: 13px;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="score-panel">
        <div>Score <span id="score-value">0</span></div>
        <div id="cleaned">Cleaned: <span id="cleaned-value">0</span></div>
        <div id="complaints-line">Complaints: <span id="complaints">0</span></div>
        <div id="combo">
          <span id="combo-value">x2</span>
          <div id="combo-bar"><div id="combo-fill"></div></div>
        </div>
      </div>
      <div id="cleanliness-meter">
        <div>Cleanliness: <span id="cleanliness-value">100</span>%</div>
        <div id="cleanliness-bar">
          <div id="cleanliness-fill" style="width: 100%"></div>
        </div>
      </div>
    </div>
    <div id="hurt-flash"></div>
    <div id="objective-arrow" aria-hidden="true">
      <div class="objective-chevron"></div>
    </div>
    <div id="minimap-panel">
      <canvas id="minimap"></canvas>
    </div>
    <div id="clock-panel">
      <div id="clock">06:00</div>
      <div id="weather">Cloudy</div>
    </div>
    <div id="mugshot-panel">
      <canvas id="mugshot"></canvas>
    </div>
    <div id="health-panel">
      HEALTH
      <div id="health-bar"><div id="health-fill"></div></div>
    </div>
    <div id="game-over">
      <h1>PECKED TO DEATH</h1>
      <p id="game-over-detail"></p>
      <button id="restart">BACK TO WORK</button>
    </div>
    <div id="messages"></div>
    <div id="instructions">
      WASD: Move | Shift: Run | Mouse: Look | Click: Spray | ESC: Lock/Unlock mouse
    </div>
    <div id="rotate-prompt">
      <div class="rotate-card">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p>Turn your phone sideways to play</p>
      </div>
    </div>
    <div id="mobile-controls">
      <div id="joystick-container" class="stick">
        <div id="joystick-knob" class="stick-knob"></div>
      </div>
      <div id="spray-joystick-container" class="stick">
        <div id="spray-joystick-knob" class="stick-knob"></div>
      </div>
      <div id="look-joystick-container" class="stick">
        <div id="look-joystick-knob" class="stick-knob"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
