<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <meta
      name="description"
      content="Pompey Punch-Up — a crude hand-drawn Streets of Rage–style brawler set in Portsmouth, UK. Wake up on Southsea beach. Start fighting."
    />
    <meta name="theme-color" content="#1a1410" />
    <meta property="og:title" content="Pompey Punch-Up" />
    <meta
      property="og:description"
      content="Hungover on Southsea beach. Mean lads pile out of a car. The brawling begins."
    />
    <meta property="og:type" content="website" />
    <title>Pompey Punch-Up</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --mp-ink: #1a1410;
        --mp-cream: #f2e6d8;
        --mp-sand: #c4a882;
        --mp-amber: #ffe08a;
        --mp-pad: rgba(26, 20, 16, 0.55);
        --mp-pad-down: rgba(255, 224, 138, 0.45);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        /* svh = visible height with browser chrome showing; avoids title crop */
        height: 100%;
        height: 100svh;
        max-height: 100dvh;
        overflow: hidden;
        background: #1a1410;
        font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive,
          sans-serif;
        touch-action: none;
        -ms-touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        /* Keep the canvas inside the safe / visible area on notched phones */
        padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
        box-sizing: border-box;
        touch-action: none;
      }

      /* Edge-to-edge on mobile — pads already respect safe insets */
      body.mobile-play #game-root {
        padding: 0;
      }

      #game-root canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: auto;
        touch-action: none;
      }

      /* Don't let max-* shrink Phaser's EXPAND canvas below the size it expects */
      body.mobile-play #game-root canvas {
        max-width: none;
        max-height: none;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 50% 28%, #3a2e24 0%, #1a1410 68%),
          #1a1410;
        color: var(--mp-cream);
        text-align: center;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #boot-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot-loader .boot-wordmark {
        margin: 0;
        font-family: Impact, "Arial Black", "Helvetica Neue", sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: clamp(2.4rem, 11vw, 4.6rem);
        line-height: 0.88;
        letter-spacing: -0.04em;
        color: #e8f2ff;
        text-shadow:
          3px 4px 0 #061018,
          -1px -1px 0 #ff2a1a,
          1px 0 0 #ffcc33;
      }

      #boot-loader .boot-wordmark span {
        display: block;
      }

      /* Author display:block on .boot-logo was beating [hidden], so the
         canvas + Safari <img> fallback both showed on desktop. */
      #boot-loader [hidden] {
        display: none !important;
      }

      #boot-loader .boot-logo {
        display: block;
        width: min(520px, 88vw);
        /* Explicit height — iOS canvas + height:auto often collapses to 0 */
        height: calc(min(520px, 88vw) * 178 / 820);
        max-width: 92vw;
        max-height: 28vh;
        margin: 0;
        object-fit: contain;
      }

      #boot-loader .boot-line {
        margin: 0;
        font-size: 0.95rem;
        color: var(--mp-sand);
      }

      #boot-loader .boot-version {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(0.7rem, var(--safe-b));
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: var(--mp-sand);
        opacity: 0.72;
      }

      #boot-loader .boot-bar {
        width: min(220px, 55vw);
        height: 10px;
        border: 2px solid var(--mp-sand);
        border-radius: 3px;
        overflow: hidden;
        background: #1a1410;
      }

      #boot-loader .boot-bar > i {
        display: block;
        height: 100%;
        width: 38%;
        background: linear-gradient(90deg, #c45c4a, var(--mp-amber));
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      #rotate-gate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        padding-left: calc(1.5rem + var(--safe-l));
        padding-right: calc(1.5rem + var(--safe-r));
        background:
          radial-gradient(ellipse at 50% 30%, #3a2e24 0%, #1a1410 70%),
          #1a1410;
        color: var(--mp-cream);
        text-align: center;
      }

      body.mobile-portrait #rotate-gate {
        display: flex;
      }

      body.mobile-portrait #game-root,
      body.mobile-portrait #mobile-pad {
        visibility: hidden;
        pointer-events: none;
      }

      #rotate-gate .phone {
        width: 52px;
        height: 88px;
        border: 3px solid var(--mp-amber);
        border-radius: 10px;
        position: relative;
        animation: tip-phone 1.6s ease-in-out infinite;
      }

      #rotate-gate .phone::after {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        width: 16px;
        height: 3px;
        margin-left: -8px;
        background: var(--mp-amber);
        border-radius: 2px;
      }

      @keyframes tip-phone {
        0%,
        20% {
          transform: rotate(0deg);
        }
        45%,
        70% {
          transform: rotate(90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      #rotate-gate h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: normal;
        color: var(--mp-amber);
      }

      #rotate-gate p {
        margin: 0;
        max-width: 16rem;
        font-size: 0.95rem;
        line-height: 1.35;
        color: var(--mp-sand);
      }

      #mobile-pad {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
      }

      #mobile-pad[hidden] {
        display: none !important;
      }

      .mp-cluster {
        position: absolute;
        display: grid;
        gap: 8px;
        pointer-events: none;
      }

      /* Left half — floating stick appears under the thumb */
      .mp-stick-zone {
        position: absolute;
        left: 0;
        top: 18%;
        bottom: 0;
        width: min(46vw, 320px);
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .mp-stick {
        position: fixed;
        width: 118px;
        height: 118px;
        margin-left: -59px;
        margin-top: -59px;
        border-radius: 999px;
        pointer-events: none;
        opacity: 0.32;
        transition: opacity 0.12s ease;
        left: max(72px, calc(var(--safe-l) + 72px));
        top: auto;
        bottom: max(64px, calc(var(--safe-b) + 64px));
      }

      .mp-stick.is-active {
        opacity: 1;
        bottom: auto;
      }

      .mp-stick-base {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 2px solid rgba(242, 230, 216, 0.28);
        background: radial-gradient(
          circle at 50% 45%,
          rgba(60, 48, 40, 0.35),
          rgba(20, 14, 10, 0.55)
        );
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
      }

      .mp-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 999px;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 200, 120, 0.45);
        background: radial-gradient(
          circle at 40% 35%,
          rgba(90, 70, 55, 0.9),
          rgba(40, 28, 20, 0.92)
        );
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
      }

      .mp-stick-zone.is-active .mp-stick-knob {
        border-color: rgba(255, 200, 120, 0.7);
      }

      .mp-cluster--fight {
        pointer-events: none;
        right: max(10px, var(--safe-r));
        bottom: max(12px, var(--safe-b));
        grid-template-columns: 68px 68px;
        grid-template-rows: 56px 56px 56px;
        grid-template-areas:
          "punch kick"
          "grab block"
          "run jump";
      }

      .mp-act--punch {
        grid-area: punch;
      }
      .mp-act--kick {
        grid-area: kick;
      }
      .mp-act--grab {
        grid-area: grab;
      }
      .mp-act--block {
        grid-area: block;
      }
      .mp-act--run {
        grid-area: run;
      }
      .mp-act--jump {
        grid-area: jump;
      }

      .mp-btn {
        pointer-events: auto;
        touch-action: none;
        appearance: none;
        border: 2px solid rgba(242, 230, 216, 0.35);
        border-radius: 999px;
        background: var(--mp-pad);
        color: var(--mp-cream);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.02em;
        min-width: 52px;
        min-height: 52px;
        padding: 0;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        -webkit-tap-highlight-color: transparent;
      }

      .mp-act {
        font-size: 13px;
        font-weight: bold;
      }

      .mp-act--punch,
      .mp-act--kick {
        min-width: 68px;
        min-height: 56px;
        background: rgba(90, 36, 28, 0.72);
        border-color: rgba(255, 180, 120, 0.4);
      }

      .mp-act--jump {
        background: rgba(40, 70, 90, 0.72);
      }

      .mp-act--block {
        background: rgba(50, 55, 70, 0.72);
      }

      .mp-act--run {
        background: rgba(70, 55, 30, 0.72);
      }

      .mp-pause {
        min-width: 48px;
        min-height: 44px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 0.08em;
        border-radius: 12px;
        opacity: 0.95;
      }

      #game-pause-btn {
        display: none;
        position: fixed;
        z-index: 35;
        top: max(12px, var(--safe-t));
        right: max(12px, var(--safe-r));
        pointer-events: auto;
        cursor: pointer;
      }

      #game-pause-btn.is-on {
        display: block;
      }

      #game-pause-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 32;
        align-items: center;
        justify-content: center;
        background: rgba(26, 20, 16, 0.62);
        pointer-events: auto;
      }

      #game-pause-overlay.is-on {
        display: flex;
      }

      .game-pause-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
      }

      .game-pause-title {
        margin: 0 0 8px;
        font-size: 36px;
        color: #ffe08a;
      }

      .game-pause-resume,
      .game-pause-restart {
        appearance: none;
        font: inherit;
        cursor: pointer;
        border: 0;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      .game-pause-resume {
        font-size: 22px;
        color: #1a1410;
        background: #ffe08a;
        padding: 10px 22px;
        min-height: 48px;
      }

      .game-pause-restart {
        font-size: 18px;
        color: #f2e6d8;
        background: #3a3028;
        padding: 8px 16px;
        min-height: 44px;
      }

      #game-prompt-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 32;
        align-items: center;
        justify-content: center;
        background: rgba(26, 20, 16, 0.62);
        pointer-events: auto;
      }

      #game-prompt-overlay.is-on {
        display: flex;
      }

      .game-prompt-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: min(28rem, calc(100vw - 32px));
        padding: 22px 28px;
        background: #f2e6d8;
        color: #1a1410;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
      }

      .game-prompt-title {
        margin: 0;
        font-size: 28px;
        color: #1a1410;
        text-align: center;
        white-space: pre-line;
      }

      .game-prompt-body {
        margin: 0;
        font-size: 16px;
        color: #1a1410;
        text-align: center;
        white-space: pre-line;
      }

      .game-prompt-btn {
        appearance: none;
        font: inherit;
        font-size: 22px;
        color: #1a1410;
        background: #ffe08a;
        border: 0;
        padding: 12px 28px;
        min-height: 48px;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      .game-prompt-alt {
        appearance: none;
        font: inherit;
        font-size: 18px;
        color: #f2e6d8;
        background: #3a3028;
        border: 0;
        padding: 8px 16px;
        min-height: 44px;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      .mp-btn.is-down {
        background: var(--mp-pad-down);
        color: var(--mp-ink);
        border-color: var(--mp-amber);
        transform: translateY(1px);
        box-shadow: none;
      }

      @media (max-height: 420px) {
        .mp-stick {
          width: 100px;
          height: 100px;
          margin-left: -50px;
          margin-top: -50px;
        }
        .mp-stick-knob {
          width: 46px;
          height: 46px;
        }
        .mp-cluster--fight {
          grid-template-columns: 58px 58px;
          grid-template-rows: 48px 48px 48px;
        }
        .mp-btn {
          min-width: 44px;
          min-height: 44px;
          font-size: 11px;
        }
      }

      noscript {
        color: #f2e6d8;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <h1 class="boot-wordmark" id="boot-wordmark">
        <span>POMPEY</span>
        <span>PUNCH-UP</span>
      </h1>
      <canvas
        id="boot-logo"
        class="boot-logo"
        width="820"
        height="178"
        hidden
        aria-hidden="true"
      ></canvas>
      <p class="boot-line">Waking up on Southsea…</p>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
      <p class="boot-version">v%APP_VERSION%</p>
    </div>
    <div id="rotate-gate" aria-live="polite">
      <div class="phone" aria-hidden="true"></div>
      <h1>Tip it sideways</h1>
      <p>Pompey Punch-Up plays in landscape — rotate your phone and fill the screen.</p>
    </div>
    <div id="game-root"></div>
    <noscript>Pompey Punch-Up needs JavaScript on. Turn it on and refresh, mate.</noscript>
    <script type="module" src="/src/paint-boot-logo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
