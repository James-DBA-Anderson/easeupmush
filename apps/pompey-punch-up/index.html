<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <meta
      name="description"
      content="Pompey Punch-Up — a crude hand-drawn Streets of Rage–style brawler set in Portsmouth, UK. Wake up on Southsea beach. Start fighting."
    />
    <meta name="theme-color" content="#1a1410" />
    <meta property="og:title" content="Pompey Punch-Up" />
    <meta
      property="og:description"
      content="Hungover on Southsea beach. Mean lads pile out of a car. The brawling begins."
    />
    <meta property="og:type" content="website" />
    <title>Pompey Punch-Up</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --mp-ink: #1a1410;
        --mp-cream: #f2e6d8;
        --mp-sand: #c4a882;
        --mp-amber: #ffe08a;
        --mp-pad: rgba(26, 20, 16, 0.55);
        --mp-pad-down: rgba(255, 224, 138, 0.45);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        /* svh = visible height with browser chrome showing; avoids title crop */
        height: 100%;
        height: 100svh;
        max-height: 100dvh;
        overflow: hidden;
        background: #1a1410;
        font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive,
          sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        /* Keep the canvas inside the safe / visible area on notched phones */
        padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
        box-sizing: border-box;
      }

      #game-root canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: auto;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 50% 28%, #3a2e24 0%, #1a1410 68%),
          #1a1410;
        color: var(--mp-cream);
        text-align: center;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #boot-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot-loader .boot-logo {
        display: block;
        width: min(520px, 88vw);
        height: auto;
        margin: 0;
      }

      #boot-loader .boot-line {
        margin: 0;
        font-size: 0.95rem;
        color: var(--mp-sand);
      }

      #boot-loader .boot-bar {
        width: min(220px, 55vw);
        height: 10px;
        border: 2px solid var(--mp-sand);
        border-radius: 3px;
        overflow: hidden;
        background: #1a1410;
      }

      #boot-loader .boot-bar > i {
        display: block;
        height: 100%;
        width: 38%;
        background: linear-gradient(90deg, #c45c4a, var(--mp-amber));
        animation: boot-slide 1.1s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      #rotate-gate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        padding-left: calc(1.5rem + var(--safe-l));
        padding-right: calc(1.5rem + var(--safe-r));
        background:
          radial-gradient(ellipse at 50% 30%, #3a2e24 0%, #1a1410 70%),
          #1a1410;
        color: var(--mp-cream);
        text-align: center;
      }

      body.mobile-portrait #rotate-gate {
        display: flex;
      }

      body.mobile-portrait #game-root,
      body.mobile-portrait #mobile-pad {
        visibility: hidden;
        pointer-events: none;
      }

      #rotate-gate .phone {
        width: 52px;
        height: 88px;
        border: 3px solid var(--mp-amber);
        border-radius: 10px;
        position: relative;
        animation: tip-phone 1.6s ease-in-out infinite;
      }

      #rotate-gate .phone::after {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        width: 16px;
        height: 3px;
        margin-left: -8px;
        background: var(--mp-amber);
        border-radius: 2px;
      }

      @keyframes tip-phone {
        0%,
        20% {
          transform: rotate(0deg);
        }
        45%,
        70% {
          transform: rotate(90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      #rotate-gate h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: normal;
        color: var(--mp-amber);
      }

      #rotate-gate p {
        margin: 0;
        max-width: 16rem;
        font-size: 0.95rem;
        line-height: 1.35;
        color: var(--mp-sand);
      }

      #mobile-pad {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
      }

      #mobile-pad[hidden] {
        display: none !important;
      }

      .mp-cluster {
        position: absolute;
        display: grid;
        gap: 8px;
        pointer-events: none;
      }

      .mp-cluster--move {
        left: max(10px, var(--safe-l));
        bottom: max(12px, var(--safe-b));
        grid-template-columns: 56px 56px 56px;
        grid-template-rows: 56px 56px 56px;
        grid-template-areas:
          ". up ."
          "left . right"
          ". down .";
      }

      .mp-cluster--move [data-dir="up"] {
        grid-area: up;
      }
      .mp-cluster--move [data-dir="left"] {
        grid-area: left;
      }
      .mp-cluster--move [data-dir="right"] {
        grid-area: right;
      }
      .mp-cluster--move [data-dir="down"] {
        grid-area: down;
      }

      .mp-cluster--meta {
        left: max(10px, var(--safe-l));
        top: max(10px, var(--safe-t));
        grid-auto-flow: column;
        gap: 6px;
      }

      .mp-cluster--fight {
        right: max(10px, var(--safe-r));
        bottom: max(12px, var(--safe-b));
        grid-template-columns: 64px 72px;
        grid-template-rows: 56px 64px 56px;
        grid-template-areas:
          "jump punch"
          "grab kick"
          "use use";
      }

      .mp-act--jump {
        grid-area: jump;
      }
      .mp-act--punch {
        grid-area: punch;
      }
      .mp-act--grab {
        grid-area: grab;
      }
      .mp-act--kick {
        grid-area: kick;
      }
      .mp-act--use {
        grid-area: use;
      }

      .mp-btn {
        pointer-events: auto;
        touch-action: none;
        appearance: none;
        border: 2px solid rgba(242, 230, 216, 0.35);
        border-radius: 999px;
        background: var(--mp-pad);
        color: var(--mp-cream);
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.02em;
        min-width: 52px;
        min-height: 52px;
        padding: 0;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        -webkit-tap-highlight-color: transparent;
      }

      .mp-dir {
        font-size: 16px;
        line-height: 1;
      }

      .mp-act {
        font-size: 13px;
        font-weight: bold;
      }

      .mp-act--punch,
      .mp-act--kick {
        min-width: 68px;
        min-height: 64px;
        background: rgba(90, 36, 28, 0.72);
        border-color: rgba(255, 180, 120, 0.4);
      }

      .mp-act--jump {
        background: rgba(40, 70, 90, 0.72);
      }

      .mp-meta {
        min-width: 48px;
        min-height: 40px;
        font-size: 11px;
        border-radius: 12px;
        opacity: 0.92;
      }

      .mp-meta--restart {
        min-width: 36px;
        opacity: 0.55;
      }

      .mp-btn.is-down {
        background: var(--mp-pad-down);
        color: var(--mp-ink);
        border-color: var(--mp-amber);
        transform: translateY(1px);
        box-shadow: none;
      }

      @media (max-height: 420px) {
        .mp-cluster--move {
          grid-template-columns: 48px 48px 48px;
          grid-template-rows: 48px 48px 48px;
        }
        .mp-cluster--fight {
          grid-template-columns: 56px 62px;
          grid-template-rows: 48px 56px 44px;
        }
        .mp-btn {
          min-width: 44px;
          min-height: 44px;
          font-size: 11px;
        }
      }

      noscript {
        color: #f2e6d8;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <canvas
        id="boot-logo"
        class="boot-logo"
        width="820"
        height="178"
        aria-label="Pompey Punch-Up"
      ></canvas>
      <p class="boot-line">Waking up on Southsea…</p>
      <div class="boot-bar" aria-hidden="true"><i></i></div>
    </div>
    <div id="rotate-gate" aria-live="polite">
      <div class="phone" aria-hidden="true"></div>
      <h1>Tip it sideways</h1>
      <p>Pompey Punch-Up plays in landscape — rotate your phone and fill the screen.</p>
    </div>
    <div id="game-root"></div>
    <noscript>Pompey Punch-Up needs JavaScript on. Turn it on and refresh, mate.</noscript>
    <script type="module" src="/src/paint-boot-logo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
