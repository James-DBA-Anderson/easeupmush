<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1c24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pompeymon</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07141a;
        overflow: hidden;
        touch-action: none;
      }
      html.touch-ui,
      html.touch-ui body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #6d7076;
      }
      #shell {
        height: 100%;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #07141a;
      }
      html.touch-ui #shell {
        height: 100%;
        background: #6d7076;
      }
      #game-screen {
        flex: 1;
        min-height: 0;
        display: grid;
        place-items: center;
      }
      #game-screen canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #touch-pad {
        display: none;
        flex: 1;
        align-items: stretch;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px calc(16px + env(safe-area-inset-bottom));
        user-select: none;
        -webkit-user-select: none;
      }
      html.touch-ui #game-screen {
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: 240 / 160;
        margin: 0 auto;
        background: #1a1814;
      }
      html.touch-ui #touch-pad {
        display: flex;
        background: linear-gradient(#9aa0a6, #656970);
        border-top: 4px solid #c4c8cc;
        box-shadow: inset 0 10px 14px rgba(0, 0, 0, 0.22);
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        place-items: center;
        background: #07141a;
        color: #e8f0f4;
        font-family: "Press Start 2P", monospace;
        font-size: 12px;
        text-align: center;
        line-height: 1.8;
        padding: 24px;
      }
      html.needs-portrait #rotate-hint {
        display: grid;
      }
      .dpad {
        position: relative;
        width: 42vw;
        max-width: 180px;
        aspect-ratio: 1;
        margin: auto 0;
        background: #5c6066;
        border-radius: 18px;
        box-shadow:
          inset 0 2px 0 #c8ccd0,
          0 3px 0 #3a3e42;
        touch-action: none;
      }
      .dpad-cross {
        pointer-events: none;
        position: absolute;
        left: 33%;
        top: 6%;
        width: 34%;
        height: 88%;
        background: #2a2a2e;
        border-radius: 8px;
      }
      .dpad-cross::after {
        content: "";
        position: absolute;
        left: -97%;
        top: 33%;
        width: 294%;
        height: 34%;
        background: #2a2a2e;
        border-radius: 8px;
      }
      .dpad button {
        position: absolute;
        width: 34%;
        height: 34%;
        border: 0;
        background: transparent;
        color: #b8b8bc;
        border-radius: 8px;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
      }
      .dpad button.held {
        color: #f2f2f2;
      }
      .dpad .n {
        left: 33%;
        top: 0;
      }
      .dpad .s {
        left: 33%;
        bottom: 0;
      }
      .dpad .w {
        left: 0;
        top: 33%;
      }
      .dpad .e {
        right: 0;
        top: 33%;
      }
      .actions {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        gap: 16px;
        margin: auto 0;
      }
      .actions button {
        border: 3px solid #3a3a3e;
        background: #4a2a32;
        color: #e8d8d8;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        border-radius: 999px;
        box-shadow: 0 3px 0 #2a1a1e;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .actions button:active {
        background: #6a3844;
        transform: translateY(2px);
        box-shadow: none;
      }
      .actions [data-pad="action"] {
        width: 92px;
        height: 92px;
        background: #6a303c;
      }
      .actions [data-pad="cancel"] {
        width: 64px;
        height: 64px;
        font-size: 8px;
        background: #4a4e54;
        border-color: #2a2e32;
        color: #d0d4d8;
        box-shadow: 0 3px 0 #2a2e32;
      }
      .actions [data-pad="bag"] {
        display: none;
        width: 64px;
        height: 64px;
        font-size: 8px;
        background: #3a4850;
        border-color: #2a3034;
        color: #d8e0e4;
        box-shadow: 0 3px 0 #2a3034;
      }
      html.touch-ui.has-bag .actions [data-pad="bag"] {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="rotate-hint">Turn your phone<br />upright.</div>
      <div id="game-screen"></div>
      <div id="touch-pad">
        <div class="dpad">
          <div class="dpad-cross"></div>
          <button type="button" class="n" data-dir="up" tabindex="-1" aria-label="Up">▲</button>
          <button type="button" class="w" data-dir="left" tabindex="-1" aria-label="Left">◀</button>
          <button type="button" class="e" data-dir="right" tabindex="-1" aria-label="Right">▶</button>
          <button type="button" class="s" data-dir="down" tabindex="-1" aria-label="Down">▼</button>
        </div>
        <div class="actions">
          <button type="button" data-pad="bag" tabindex="-1">BAG</button>
          <button type="button" data-pad="cancel" tabindex="-1">BACK</button>
          <button type="button" data-pad="action" tabindex="-1">LOOK</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
