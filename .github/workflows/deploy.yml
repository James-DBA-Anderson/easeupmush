name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://easeupmush.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # `cf deploy` without --prebuilt runs workspace autoconfig at the repo
      # root and fails. The deployable app is assembled dist/, not a workspace
      # package. --prebuilt uploads that output and still has no --json flag.
      - name: Prepare Cloudflare build output
        run: node scripts/write-cf-output.mjs

      - name: Deploy to Cloudflare
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Output deployment URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          echo "Deployment complete!"
          npx cf workers get easeupmush > deploy-output.json
          jq -r '.subdomain.url // .url // "Deployment successful"' deploy-output.json
