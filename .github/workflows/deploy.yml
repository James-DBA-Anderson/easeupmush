name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://easeupmush.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch Git LFS map mesh
        run: git lfs pull --include="apps/simpompey/public/models/portsmouth-terrain.bin"

      - name: Verify map mesh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/simpompey/public/models/portsmouth-terrain.bin")
          with p.open("rb") as f:
              data = f.read(80)
          if data.startswith(b"version https://git-lfs.github.com/spec/v1"):
              raise SystemExit("terrain.bin is still a Git LFS pointer")
          size = p.stat().st_size
          print(f"terrain.bin {size} bytes")
          if size < 1_000_000:
              raise SystemExit("Git LFS did not fetch portsmouth-terrain.bin")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deploy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # cf refuses to run at an npm workspace root, so deploy from deploy/,
      # which has its own install and points its assets at ../dist.
      - name: Install deploy tooling
        working-directory: deploy
        run: npm ci

      # 264 MB terrain.bin cannot be a Worker static asset (25 MiB/file).
      # Put it on R2, then strip it from dist/ before cf deploy.
      - name: Publish map mesh to R2
        run: node scripts/publish-map-assets.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `cf deploy` does not accept --json. Generated API commands print JSON
      # on stdout by default, so capture the Worker record after deploy.
      - name: Deploy to Cloudflare
        working-directory: deploy
        run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Output deployment URL
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: "1"
        run: |
          echo "Deployment complete!"
          npx cf workers get easeupmush > deploy-output.json
          jq -r '.subdomain.url // .url // "Deployment successful"' deploy-output.json
